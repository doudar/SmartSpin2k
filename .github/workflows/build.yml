name: build

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Ensure changelog is updated
        uses: dangoslen/changelog-enforcer@v3.6.1
      
      - name: Get current date
        id: date
        run: echo "date=$(date +'%y.%-m.%-d')" >> $GITHUB_OUTPUT
      
      - name: Test with environment variables
        run: echo $TAG_NAME - $RELEASE_NAME
        env:
          TAG_NAME: ${{ steps.date.outputs.date }}
          RELEASE_NAME: ${{ steps.date.outputs.date }}- 
      
      - uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ steps.date.outputs.date }}
          message: "Automatic release ${{ steps.date.outputs.date }}"
      
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            software:
              - '!(Hardware/**)'
            hardware:
              - 'Hardware/**'
      
      - name: Install ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32
      
      - name: Setup external dependencies
        run: |
          chmod +x setup_dependencies.sh
          ./setup_dependencies.sh
      
      - name: Check pre-commit hooks
        uses: pre-commit/action@v3.0.1
      
      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32
          idf.py build
      
      - name: Build filesystem (LittleFS)
        run: |
          . $IDF_PATH/export.sh
          idf.py littlefs-create-partition-image littlefs data
      
      - name: Create artifacts
        run: |
          mkdir -p artifacts
          cp build/SmartSpin2k.bin artifacts/
          cp build/bootloader/bootloader.bin artifacts/
          cp build/partition_table/partition-table.bin artifacts/
          cp build/littlefs.bin artifacts/ || echo "LittleFS image not found, skipping"
          cd artifacts
          7z a ../SmartSpin2kFirmware-${{ steps.date.outputs.date }}.bin.zip *.bin
          cd ..
      
      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: all-artifacts
          path: SmartSpin2kFirmware-${{ steps.date.outputs.date }}.bin.zip
      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          name: all-artifacts
      - name: Get tag info
        id: tag_info
        run: echo "SOURCE_TAG=${{ steps.date.outputs.date }}" >> $GITHUB_OUTPUT
      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_info.outputs.SOURCE_TAG }}
          name: SmartSpin2k ${{ steps.tag_info.outputs.SOURCE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: ${{ github.event.head_commit.message }}
          files: |
            SmartSpin2kFirmware-${{ steps.date.outputs.date }}.bin.zip
      
      - name: Update changelog
        uses: thomaseizinger/keep-a-changelog-new-release@v3
        with:
          version: ${{ steps.date.outputs.date }}


      
