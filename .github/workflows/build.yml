name: build

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-platformio-
      - name: Ensure changelog is updated
        uses: dangoslen/changelog-enforcer@v3.7.0
      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
      - name: Get current date
        id: date
        run: echo "date=$(date +'%y.%-m.%-d')" >> $GITHUB_OUTPUT
      - name: Test with environment variables
        run: echo $TAG_NAME - $RELEASE_NAME
        env:
          TAG_NAME: ${{ steps.date.outputs.date }}
          RELEASE_NAME: ${{ steps.date.outputs.date }}- 
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            software:
              - '!(Hardware/**)'
            hardware:
              - 'Hardware/**'
      - name: Show python version
        run: python --version
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Pre-install PlatformIO packages (release env)
        run: |
          platformio pkg install -e release
          platformio pkg install -e S3release
      - name: Check pre-commit hooks
        uses: pre-commit/action@v3.0.1
      - name: Build firmware
        run: platformio run -e release
      - name: Build filesystem
        run: platformio run -e release --target buildfs
      - name: Build S3 firmware
        run: platformio run -e S3release
      - name: Build S3 filesystem
        run: platformio run -e S3release --target buildfs
      - name: Create artifacts
        run: |
          cp ./.pio/build/release/firmware.bin firmware.bin
          cp ./.pio/build/release/firmware.factory.bin firmware.factory.bin
          cp ./.pio/build/release/littlefs.bin littlefs.bin
          cp ./.pio/build/release/partitions.bin partitions.bin
          cp ./.pio/build/release/bootloader.bin bootloader.bin
          cp ./.pio/build/S3release/S3firmware.bin S3firmware.bin
          cp ./.pio/build/S3release/S3firmware.factory.bin S3firmware.factory.bin
          cp ./.pio/build/S3release/S3littlefs.bin S3littlefs.bin
          cp ./.pio/build/S3release/S3partitions.bin S3partitions.bin
          cp ./.pio/build/S3release/S3bootloader.bin S3bootloader.bin
          7z a SmartSpin2kFirmware-${{ steps.date.outputs.date }}.bin.zip firmware.bin firmware.factory.bin littlefs.bin partitions.bin bootloader.bin S3firmware.bin S3firmware.factory.bin S3littlefs.bin S3partitions.bin S3bootloader.bin
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          name: all-artifacts
          path: |
            SmartSpin2kFirmware-${{ steps.date.outputs.date }}.bin.zip
            firmware.factory.bin
            S3firmware.factory.bin
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: all-artifacts
      - name: Get tag info
        id: tag_info
        run: echo "SOURCE_TAG=${{ steps.date.outputs.date }}" >> $GITHUB_OUTPUT
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_info.outputs.SOURCE_TAG }}
          target_commitish: ${{ github.sha }}
          name: SmartSpin2k ${{ steps.tag_info.outputs.SOURCE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          body: ${{ github.event.head_commit.message }}
          files: |
            SmartSpin2kFirmware-${{ steps.date.outputs.date }}.bin.zip
            firmware.factory.bin
            S3firmware.factory.bin
      - name: Update changelog
        uses: thomaseizinger/keep-a-changelog-new-release@v3
        with:
          version: ${{ steps.date.outputs.date }}


      
