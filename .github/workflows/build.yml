name: build

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.date.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Cache pioarduino packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-v2-${{ hashFiles('requirements-ci.txt') }}-${{ hashFiles('platformio.ini', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-platformio-v2-${{ hashFiles('requirements-ci.txt') }}-
      - name: Ensure changelog is updated
        uses: dangoslen/changelog-enforcer@v3.7.0
      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel
      - name: Get current date
        id: date
        run: |
          release_version=$(date +'%y.%-m.%-d')
          echo "date=$release_version" >> "$GITHUB_OUTPUT"
          echo "SS2K_FIRMWARE_VERSION=$release_version" >> "$GITHUB_ENV"
      - name: Test with environment variables
        run: echo $TAG_NAME - $RELEASE_NAME
        env:
          TAG_NAME: ${{ steps.date.outputs.date }}
          RELEASE_NAME: ${{ steps.date.outputs.date }}- 
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            software:
              - '!(Hardware/**)'
            hardware:
              - 'Hardware/**'
      - name: Show python version
        run: python --version
      - name: Install pioarduino Core
        run: python -m pip install -r requirements-ci.txt
      - name: Pre-install pioarduino packages (release environments)
        run: |
          platformio pkg install -e release
          platformio pkg install -e S3release
      - name: Check pre-commit hooks
        uses: pre-commit/action@v3.0.1
      - name: Build firmware
        run: platformio run -e release
      - name: Build S3 firmware
        run: platformio run -e S3release
      - name: Stage firmware binaries for the signing job
        run: |
          mkdir -p release-inputs/{release,S3release}
          cp .pio/build/release/{firmware.bin,firmware.factory.bin,partitions.bin,bootloader.bin} release-inputs/release/
          cp .pio/build/S3release/{S3firmware.bin,S3firmware.factory.bin,S3partitions.bin,S3bootloader.bin} release-inputs/S3release/
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-build-inputs
          path: release-inputs/
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    env:
      SOURCE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --only-binary=:all: -r scripts/requirements-release.txt
      - uses: actions/download-artifact@v8
        with:
          name: firmware-build-inputs
          path: release-inputs
      - name: Sign release with the pinned publisher key
        env:
          SS2K_PRIVATE_KEY: ${{ secrets.SS2K_PRIVATE_KEY }}
          SS2K_KEY_PASS: ${{ secrets.SS2K_KEY_PASS }}
        run: python scripts/sign_release.py sign --tag "$SOURCE_TAG" --build-dir release-inputs
      - uses: actions/upload-artifact@v7
        with:
          name: all-artifacts
          path: |
            signed-release/SmartSpin2kFirmware-${{ needs.build.outputs.tag }}.bin.zip
            signed-release/firmware-manifest.json
            signed-release/firmware-manifest.sig
          if-no-files-found: error

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SOURCE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --only-binary=:all: -r scripts/requirements-release.txt
      - uses: actions/download-artifact@v8
        with:
          name: all-artifacts
          path: signed-release
      - name: Verify downloaded public assets before publishing
        run: python scripts/sign_release.py verify --tag "$SOURCE_TAG"
      - name: Generate release notes
        run: python scripts/release_notes.py --tag "$SOURCE_TAG" --repository "$GITHUB_REPOSITORY" --output release-notes.md
      - name: Remove obsolete standalone factory assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$SOURCE_TAG" > /dev/null 2>&1; then
            for asset in firmware.factory.bin S3firmware.factory.bin; do
              if gh release view "$SOURCE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
                gh release delete-asset "$SOURCE_TAG" "$asset" --yes
              fi
            done
          fi
      - name: Create release
        # Generate the body explicitly so changes inside PRs and direct commits
        # are included alongside GitHub's generated PR/contributor list.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SmartSpin2k ${{ needs.build.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            signed-release/SmartSpin2kFirmware-${{ needs.build.outputs.tag }}.bin.zip
            signed-release/firmware-manifest.json
            signed-release/firmware-manifest.sig
      - name: Update changelog
        uses: thomaseizinger/keep-a-changelog-new-release@v3
        with:
          version: ${{ needs.build.outputs.tag }}
