name: native-tests

on:
  pull_request:
    paths-ignore:
      - "Hardware/**"
  push:
    branches:
      - develop
    paths-ignore:
      - "Hardware/**"

jobs:
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pioarduino Core
        run: python -m pip install -r requirements-ci.txt
      - name: Run native tests
        run: platformio test -e native
