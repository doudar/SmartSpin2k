name: ride-performance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'scripts/erg_sim/**'
      - 'scripts/bike_sim/**'
      - 'test/**'
      - '.github/workflows/ride-performance.yml'

permissions:
  contents: read

jobs:
  paired-controller-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SS2K_BASELINE_SELECTION: ${{ github.workspace }}/baseline-selection.json
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: doudar/smartspin2k-simulator
          ref: e045a5daed80e1f0c8102e9b14c3a4632f0a9f0f
          path: simulator
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Resolve current develop once for this experiment
        id: baseline
        run: PYTHONPATH=simulator python -m ss2k_sim.baseline --output baseline-selection.json --github-output
      - uses: actions/checkout@v7
        with:
          repository: doudar/SmartSpin2k
          ref: ${{ steps.baseline.outputs.sha }}
          path: baseline
          persist-credentials: false
      - run: python -m pip install -e ./simulator
      - name: Verify evaluator rejects degraded rides and transport contracts
        working-directory: candidate
        run: |
          python -B -m unittest discover -s test -p test_ride_performance.py
          python -B -m unittest discover -s test -p test_packet_ride.py
          python -B -m unittest discover -s test -p 'test_virtual_*.py'
          python -B -m unittest discover -s test -p 'test_bike_*.py'
      - name: Compare production controller to resolved develop
        run: python -m ss2k_sim compare --firmware-root candidate --candidate-root candidate --baseline-root baseline --output candidate/test/output/paired --seeds 7
      - name: Preserve exact baseline resolution
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: baseline-selection-${{ github.sha }}
          path: baseline-selection.json
      - name: Preserve every result, including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: paired-controller-performance-${{ github.sha }}
          path: candidate/test/output/paired
          if-no-files-found: error
