name: ride-performance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'scripts/erg_sim/**'
      - 'scripts/bike_sim/**'
      - 'test/**'
      - '.github/workflows/ride-performance.yml'

permissions:
  contents: read

jobs:
  paired-controller-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v7
        with:
          ref: 082d1ee26ddb009d5132547087f77be03d1b0ab7
          path: baseline
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Verify evaluator rejects degraded rides and transport contracts
        working-directory: candidate
        run: |
          python -B -m unittest discover -s test -p test_ride_performance.py
          python -B -m unittest discover -s test -p test_packet_ride.py
          python -B -m unittest discover -s test -p 'test_virtual_*.py'
          python -B -m unittest discover -s test -p 'test_bike_*.py'
      - name: Compare production controller to pinned develop
        working-directory: candidate
        run: python -m scripts.erg_sim.compare --baseline-root ../baseline --output test/output/paired --seeds 7
      - name: Preserve every result, including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: paired-controller-performance-${{ github.sha }}
          path: candidate/test/output/paired
          if-no-files-found: error
