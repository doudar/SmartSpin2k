  <script>
    // ======== Settings Configuration ========
    // This object defines all settings that will be generated
    const settingsConfig = {
      ssid: {
        type: 'text',
        title: 'WiFi SSID',
        tooltip: 'Network name',
        tooltipText: 'WiFi network name. If it doesn\'t exist I will create a network with this name.',
        defaultValue: 'loading'
      },
      password: {
        type: 'password',
        title: 'WiFi Password',
        tooltip: 'Network password',
        tooltipText: 'Password for the WiFi network.',
        defaultValue: 'loading'
      },
      deviceName: {
        type: 'text',
        title: 'Device Name',
        tooltip: 'MDNS Name',
        tooltipText: 'DNS Name the device will use on the network.',
        defaultValue: 'loading'
      },
      autoUpdate: {
        type: 'toggle',
        title: 'Automatic Updates',
        tooltip: 'OTA firmware',
        tooltipText: 'Check for new firmware on boot?',
        defaultValue: false
      }
	};
	const settingsConfig2 = {
      pTab4Pwr: {
        type: 'toggle',
        title: 'PowerTable For Power',
        tooltip: 'Use cadence to calculate power output',
        tooltipText: 'Use the PowerTable for Power instead of PM',
        defaultValue: false
      },
      powerCorrectionFactor: {
        type: 'slider',
        title: 'Power Multiplier',
        tooltip: 'Power Meter Correction Factor',
        tooltipText: 'Adjust this to calibrate the output of your power meter.',
        min: 0.10, max: 2.10, step: 0.01,
        defaultValue: 1.00,
        unit: 'x'
      },
      inclineMultiplier: {
        type: 'slider',
        title: 'Incline Multiplier',
        tooltip: 'Sim Mode hill effect',
        tooltipText: 'Increase to make incline changes more noticeable. Adjust until hills feel realistic.',
        min: 1, max: 10, step: 1,
        defaultValue: 5,
        unit: 'x'
      },
      ERGSensitivity: {
        type: 'slider',
        title: 'ERG Sensitivity',
        tooltip: 'Response strength',
        tooltipText: 'Increase to make ERG Mode more aggressive.',
        min: 0.1, max: 20, step: 0.1,
        defaultValue: 1.0,
        unit: ''
      }
	};
	const settingsConfig3 = {
      shiftStep: {
        type: 'slider',
        title: 'Shift Amount',
        tooltip: 'Sim Mode step size',
        tooltipText: 'Amount to move stepper per gear shift. Try to target ~30watt changes.',
        min: 10, max: 6000, step: 50, 
        defaultValue: 1200,
        unit: ''
      },
      minWatts: {
        type: 'slider',
        title: 'Min Brake Watts',
        tooltip: 'Bike power floor',
        tooltipText: 'Set the minimum watts until stepper stops. 0 disables check.',
        min: 0, max: 200, step: 5,
        defaultValue: 0,
        unit: 'W'
      },
      maxWatts: {
        type: 'slider',
        title: 'Max Brake Watts',
        tooltip: 'Bike power ceiling',
        tooltipText: 'Set the most watts you\'ve ever seen your bike absorb while you\'re pedaling. 0 disables check.',
        min: 0, max: 2000, step: 25,
        defaultValue: 0,
        unit: 'W'
      },
      stepperPower: {
        type: 'slider',
        title: 'Stepper Motor Power',
        tooltip: 'Motor current',
        tooltipText: 'Amount in milliamps for stepper motor. Set to the minimum required to move knob smoothly.',
        min: 100, max: 2000, step: 100,
        defaultValue: 0,
        unit: 'ma'
      },
      stealthChop: {
        type: 'toggle',
        title: 'Stepper StealthChop',
        tooltip: 'Silent operation mode',
        tooltipText: 'Make stepper silent at expense of torque',
        defaultValue: false
      },
      stepperDir: {
        type: 'toggle',
        title: 'Stepper Motor Direction',
        tooltip: 'Reverse rotation',
        tooltipText: 'Change Stepper Direction',
        defaultValue: false
      },
      shifterDir: {
        type: 'toggle',
        title: 'Shifter Direction',
        tooltip: 'Reverse input',
        tooltipText: 'Change Shifter Direction',
        defaultValue: false
      }
	};
	const settingsConfig4 = {
      udpLogEnabled: {
        type: 'toggle',
        title: 'UDP Logging',
        tooltip: 'Network diagnostics',
        tooltipText: 'Sending log-messages via UDP Port 10.000',
        defaultValue: false
      }
    };

    // Generate HTML for text input settings
    function createTextSetting(id, config) {
      const isPassword = config.type === 'password';
      let html = `
        <div class="setting-group">
          <h2>${config.title}</h2>
          <p class="tooltip">
            ${config.tooltip}
            <span class="tooltiptext">
              ${config.tooltipText}
            </span>
          </p>`;
      
      if (isPassword) {
        html += `
          <div class="input-group" style="padding: 0.5rem;">
            <input type="${isPassword ? 'password' : 'text'}" id="${id}" name="${id}" value="${config.defaultValue}" />
            <label style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem;">
              <input type="checkbox" id="showpassword" name="showpassword" onclick="toggleShowPassword()">
              Show Password
            </label>
          </div>`;
      } else {
        html += `<input type="text" id="${id}" name="${id}" value="${config.defaultValue}" />`;
      }
      
      html += `</div>`;
      return html;
    }

    function createSliderSetting(id, config) {
      return `
        <div class="setting-group">
          <h2>${config.title}</h2>
          <p class="tooltip">
            ${config.tooltip}
            <span class="tooltiptext">
              ${config.tooltipText}
            </span>
          </p>
          <div class="slider-group">
            <div class="value-display">
              <span id="${id}Value" class="gear-value">${config.defaultValue}</span>${config.unit ? `<span>${config.unit}</span>` : ''}
            </div>
            <div style="display: flex; align-items: center; gap: 0.25rem; width: 100%; box-sizing: border-box;">
              <button type="button" class="adjust-button" onclick="clickStep(document.getElementById('${id}'), '-')">-</button>
              <input type="range" id="${id}" name="${id}" min="${config.min}" max="${config.max}" value="${config.defaultValue}" step="${config.step}" class="slider-container"
                onchange="updateSliderAndSend(this, document.getElementById('${id}Value'))" />
              <button type="button" class="adjust-button" onclick="clickStep(document.getElementById('${id}'), '+')">+</button>
            </div>
          </div>
        </div>`;
    }

    function createToggleSetting(id, config) {
      return `
        <div class="setting-group">
          <h2>${config.title}</h2>
          <p class="tooltip">
            ${config.tooltip}
            <span class="tooltiptext">${config.tooltipText}</span>
          </p>
          <div class="toggle-group">
            <label class="switch">
              <input type="checkbox" name="${id}" id="${id}" onchange="sendSetting(this)">
              <span class="slider"></span>
            </label>
          </div>
        </div>`;
    }

    function generateSettings() {
	  //network
      const container = document.getElementById('settingsContainer');
      let html = '';
      
      for (const [id, config] of Object.entries(settingsConfig)) {
        switch (config.type) {
          case 'text':
          case 'password':
            html += createTextSetting(id, config);
            break;
          case 'slider':
            html += createSliderSetting(id, config);
            break;
          case 'toggle':
            html += createToggleSetting(id, config);
            break;
        }
      }    
      container.innerHTML = html;
	  
	  //power
      const container2 = document.getElementById('settingsContainer2');
      let html2 = '';
      
      for (const [id, config] of Object.entries(settingsConfig2)) {
        switch (config.type) {
          case 'text':
          case 'password':
            html2 += createTextSetting(id, config);
            break;
          case 'slider':
            html2 += createSliderSetting(id, config);
            break;
          case 'toggle':
            html2 += createToggleSetting(id, config);
            break;
        }
      }    
      container2.innerHTML = html2;  
    }

    //motor
      const container3 = document.getElementById('settingsContainer3');
      let html3 = '';
      
      for (const [id, config] of Object.entries(settingsConfig3)) {
        switch (config.type) {
          case 'text':
          case 'password':
            html3 += createTextSetting(id, config);
            break;
          case 'slider':
            html3 += createSliderSetting(id, config);
            break;
          case 'toggle':
            html3 += createToggleSetting(id, config);
            break;
        }
      }
      container3.innerHTML = html3;

	//advanced
      const container4 = document.getElementById('settingsContainer4');
      let html4 = '';
      
      for (const [id, config] of Object.entries(settingsConfig4)) {
        switch (config.type) {
          case 'text':
          case 'password':
            html4 += createTextSetting(id, config);
            break;
          case 'slider':
            html4 += createSliderSetting(id, config);
            break;
          case 'toggle':
            html4 += createToggleSetting(id, config);
            break;
        }
      }
      container4.innerHTML = html4;

    let debounceTimer;
    const saveStatus = document.getElementById('saveStatus');
    const confirmDialog = document.getElementById('confirmDialog');

    function showLoadDefaultsConfirmation() {
      confirmDialog.showModal();
    }

    function hideLoadDefaultsConfirmation() {
      confirmDialog.close();
    }

    function loadDefaults() {
      fetch('/load_defaults.html', { method: 'GET' })
        .then(() => {
          showSaveStatus('Settings reset to defaults', 'success');
          hideLoadDefaultsConfirmation();
          requestConfigValues();
        })
        .catch(error => showSaveStatus('Failed to reset settings', 'error'));
    }

    function showSaveStatus(message, type = 'info') {
      saveStatus.textContent = message;
      saveStatus.className = `status-message ${type}`;
      setTimeout(() => {
        saveStatus.textContent = '';
        saveStatus.className = 'status-message';
      }, 3000);
    }

    function startConfigUpdate() {
      setTimeout(() => {
        if (document.getElementById('ssid').value === 'loading') {
          requestConfigValues();
        }
      }, 1500);
    }

    function requestConfigValues() {
      var xhttp = new XMLHttpRequest();
      xhttp.onreadystatechange = function () {
        if (this.readyState == 4 && this.status == 200) {
          var obj = JSON.parse(this.responseText);
          for (const key in obj) {
            const el = document.getElementById(key);
            if (el) {
              if (el.type === 'checkbox') {
                el.checked = !!obj[key];
              } else {
                el.value = obj[key];
              }
              const valueEl = document.getElementById(key + 'Value');
              if (valueEl) {
                updateSlider(obj[key], valueEl);
              }
            }
          }
          
          const loadingWatermark = document.getElementById("loadingWatermark");
          if (loadingWatermark) {
            loadingWatermark.remove();
          }
        } else {
          startConfigUpdate();
        }
      };
      xhttp.open("GET", "/configJSON", true);
      xhttp.send();
    }

    function updateSlider(x, valueElement) {
      valueElement.innerHTML = x;
    }

    function updateSliderAndSend(element, valueElement) {
      updateSlider(element.value, valueElement);
      sendSetting(element);
    }

    function clickStep(element, direction) {
      const step = parseFloat(element.step);
      const newValue = parseFloat(element.value) + (direction === '+' ? step : -step);
      element.value = newValue;
      updateSliderAndSend(element, document.getElementById(element.name + 'Value'));
    }

    function toggleShowPassword() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function sendSetting(element) {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const params = new URLSearchParams();
        
        if (element.type === 'checkbox') {
          if (element.checked) params.append(element.name, 'true');
        } else {
          params.append(element.name, element.value);
        }
        
		settingsConfigCombined = settingsConfig.concat(settingsConfig2, settingsConfig3, settingsConfig4);
        const toggleIds = Object.entries(settingsConfigCombined)
          .filter(([_, config]) => config.type === 'toggle')
          .map(([id, _]) => id);
        
        toggleIds.forEach(id => {
          if (document.getElementById(id).checked) {
            params.append(id, 'true');
          }
        });
        
        fetch('/send_settings?' + params.toString(), { method: 'GET' })
          .then(() => showSaveStatus('Settings saved', 'success'))
          .catch(error => showSaveStatus('Failed to save settings', 'error'));
      }, 300);
    }

    window.addEventListener('load', () => {
      generateSettings();
      startConfigUpdate();
    });

  // Select all accordion headers
  var acc = document.getElementsByClassName("accordion-header");
  var i;

  for (i = 0; i < acc.length; i++) {
    acc[i].addEventListener("click", function() {
      /* Toggle between adding and removing the "active" class, to highlight the button that controls the panel */
      this.classList.toggle("active");

      /* Toggle between hiding and showing the active panel */
      var panel = this.nextElementSibling;
      if (panel.style.maxHeight) {
        // If the panel is open (has a maxHeight set), close it
        panel.style.maxHeight = null;
      } else {
        // If the panel is closed, open it by setting its height dynamically
        // Use scrollHeight to get the full height of the content, regardless of current visibility
        panel.style.maxHeight = panel.scrollHeight + "px";
      }
    });
  }

  </script>
